    skipped: {
      label: "Skipped",
      group: "warn",
      icon: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="20"/></svg>',
    },
  };

  // The user-facing name of a stage or a job status.
  //
  // A track stage reads its name from the icons above, so the line beside a
  // track always agrees with that icon's tooltip and a new stage only has to be
  // described once. Job-level statuses are listed here, and anything unlisted
  // is humanised, so a machine name such as "enriching-metadata" or "running"
  // can never reach the page.
  const JOB_LABELS = {
    queued: "Waiting to start",
    running: "Processing in progress",
    completed: "Processing complete",
    failed: "Processing failed",
  };

  window.SPOTM3U_STATUS_LABEL = function statusLabel(status) {
    const entry = window.SPOTM3U_STATUS_ICONS[status];
    if (entry) {
      return entry.label;
    }
    if (JOB_LABELS[status]) {
      return JOB_LABELS[status];
    }
    const name = String(status || "").replace(/[-_]+/g, " ");
    return name.charAt(0).toUpperCase() + name.slice(1);
  };

  // Fill every [data-status-icon] element with its Lucide icon, group colour,
  // and a data-tooltip explaining what the status means.
  function applyStatusIcons(root) {
    const scope = root || document;
    const nodes = scope.querySelectorAll ? scope.querySelectorAll("[data-status-icon]") : [];
    for (const node of nodes) {
      const entry = window.SPOTM3U_STATUS_ICONS[node.dataset.statusIcon];
      if (!entry) {
        continue;
      }
      node.classList.add("track-icon", "track-icon-" + entry.group);
      node.dataset.tooltip = entry.label;
      node.setAttribute("aria-label", entry.label);
      node.innerHTML = entry.icon;
    }
  }

  // Minimal custom tooltip: one shared element that follows the cursor and
  // shows the hovered [data-tooltip] text instead of the native browser one.
  let tooltipEl = null;

  function hideTooltip() {
    if (tooltipEl) {
      tooltipEl.classList.remove("tooltip-visible");
    }
  }

  function showTooltip(node) {
    if (!tooltipEl) {
      return;
    }
    const rect = node.getBoundingClientRect();
    const below = rect.top < 140;
    tooltipEl.textContent = node.dataset.tooltip || "";
    tooltipEl.classList.toggle("tooltip-below", below);
    tooltipEl.classList.add("tooltip-visible");
    tooltipEl.style.left = rect.left + rect.width / 2 + "px";
    tooltipEl.style.top = (below ? rect.bottom : rect.top) + "px";
  }

  function installTooltip() {
    if (installTooltip.installed) {
      return;
    }
    installTooltip.installed = true;
    tooltipEl = document.createElement("div");
    tooltipEl.className = "tooltip";
    tooltipEl.setAttribute("role", "tooltip");
    document.body.appendChild(tooltipEl);

    document.addEventListener("mouseover", (event) => {
      const node = event.target.closest("[data-tooltip]");
      if (node) {
        showTooltip(node);
      }
    });
    document.addEventListener("mouseout", (event) => {
      const node = event.target.closest("[data-tooltip]");
      const related = event.relatedTarget;
      if (node && !(related && related.closest && related.closest("[data-tooltip]") === node)) {
        hideTooltip();
      }
    });
    document.addEventListener("scroll", hideTooltip, true);
    window.addEventListener("blur", hideTooltip);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", installTooltip);
  } else {
    installTooltip();
  }
</script>
