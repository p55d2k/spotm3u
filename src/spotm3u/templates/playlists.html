<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select playlist - Exportify to M3U</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Imported playlists</p>
      <h1>Select a playlist</h1>
      {% if error %}
      <p role="alert">{{ error }}</p>
      {% endif %}
      {% if playlists %}
      <form method="post" action="{{ url_for('select_playlist', job_id=job_id) }}">
        <ul>
          {% for playlist in playlists %}
          <li>
            <label>
              <input type="radio" name="playlist_id" value="{{ loop.index0 }}" required>
              <strong>{{ playlist.name }}</strong>
              {% if playlist.track_count is not none %}
              <span>({{ playlist.track_count }} tracks)</span>
              {% endif %}
            </label>
          </li>
          {% endfor %}
        </ul>
        <button type="submit">Continue</button>
      </form>
      {% else %}
      <p role="status">The export did not contain any playlists.</p>
      {% endif %}
      <p><a href="{{ url_for('index') }}">Upload another ZIP</a></p>
    </main>
  </body>
</html>
