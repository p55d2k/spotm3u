<script>
  (() => {
    const links = document.querySelectorAll("a[data-save-m3u]");
    if (!links.length) return;

    const feedback = window.SpotM3UFeedback;
    const SAVE_FAILED = "The playlist could not be saved.";

    // pywebview cannot deliver Flask's attachment download, so the desktop
    // shell saves the playlist straight into Downloads and reports the outcome
    // through the shared toast. Every failure here is user-facing text; the
    // technical detail goes to the console.
    async function save(link, confirm) {
      // Resolve the bridge at click time: pywebview injects window.pywebview
      // only after the page has finished loading, so reading it up front is
      // wrong.
      const api = window.pywebview && window.pywebview.api;
      if (!api || typeof api.save_m3u !== "function") {
        window.location.href = link.href;
        return;
      }
      // A second click while the bridge is still saving would save twice.
      if (link.dataset.saving === "true") return;

      let result;
      link.dataset.saving = "true";
      link.setAttribute("aria-busy", "true");
      try {
        result = await api.save_m3u(
          link.dataset.jobId,
          link.dataset.playlistId,
          Boolean(confirm)
        );
      } catch (error) {
        console.error("saving the playlist failed", error);
        feedback.error(SAVE_FAILED, "Try again, or download the file in a browser.");
        return;
      } finally {
        // Both paths are settled, so the link stops looking busy before the
        // toast (which may offer another click) appears.
        link.dataset.saving = "false";
        link.removeAttribute("aria-busy");
      }
      if (!result || result.error) {
        feedback.error(SAVE_FAILED, result ? result.error : "Try again in a moment.");
        return;
      }
      // The save was refused because the playlist references missing files:
      // warn, and offer to save it anyway (the same click, confirmed). The
      // warning never expires into a dead end.
      if (result.confirm_required) {
        const missing = Number(result.missing) || 0;
        const total = Number(result.total) || 0;
        const names = Array.isArray(result.names) ? result.names : [];
        feedback.warning(
          missing + " of " + total + " tracks are missing from the download folder",
          (names.length ? "Missing: " + names.join(", ") + ". " : "") +
            "Download anyway to get a playlist that skips them.",
          {
            action: {
              label: "Download anyway",
              onClick: () => save(link, true),
            },
          }
        );
        return;
      }

      feedback.success(result.name, "Saved to Downloads.", {
        action: {
          label: "Open folder",
          onClick: async () => {
            try {
              await api.open_at(result.path);
            } catch (error) {
              // The reveal failed; the toast already says where the file lives.
              console.error("revealing the saved playlist failed", error);
            }
          },
        },
      });
    }

    for (const link of links) {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        save(link, false);
      });
    }
  })();
</script>
