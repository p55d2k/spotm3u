<script>
  (() => {
    const links = document.querySelectorAll("a[data-save-m3u]");
    if (!links.length) return;

    const toast = document.createElement("div");
    toast.id = "spotm3u-save-toast";
    toast.className = "app-toast";
    toast.setAttribute("role", "status");
    toast.setAttribute("aria-live", "polite");
    toast.hidden = true;
    document.body.appendChild(toast);

    let hideTimer;
    function showMessage(message) {
      toast.textContent = "";
      const text = document.createElement("span");
      text.textContent = message;
      toast.appendChild(text);
      showToast();
    }

    function showMessageWithAction(message, actionButton, hideAfter) {
      toast.textContent = "";
      const text = document.createElement("span");
      text.textContent = message;
      toast.appendChild(text);
      toast.appendChild(actionButton);
      actionButton.style.marginLeft = "auto";
      showToast(hideAfter);
    }

    // Warn before writing a playlist whose audio was deleted by hand: an
    // action button saves it anyway, so the warning is never a dead end.
    function showConfirmRequired(result, retryLink) {
      const count = Number(result.missing) || 0;
      const total = Number(result.total) || 0;
      const names = Array.isArray(result.names) ? result.names : [];
      const message =
        count +
        " of " +
        total +
        " tracks in this playlist reference files that are missing from the download folder" +
        (names.length ? ": " + names.join(", ") : ".") +
        " Download anyway to get a playlist that skips them.";

      const button = document.createElement("button");
      button.type = "button";
      button.className = "toast-action";
      button.textContent = "Download anyway";
      button.addEventListener("click", () => save(retryLink, true));
      showMessageWithAction(message, button, 12000);
    }

    function showSaved(filename, actionButton) {
      toast.textContent = "";

      const icon = document.createElement("span");
      icon.className = "toast-icon";
      icon.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      toast.appendChild(icon);

      const text = document.createElement("div");
      text.className = "toast-text";
      const title = document.createElement("strong");
      title.textContent = filename;
      text.appendChild(title);
      const muted = document.createElement("span");
      muted.className = "toast-muted";
      muted.textContent = "Saved to Downloads.";
      text.appendChild(muted);
      toast.appendChild(text);

      if (actionButton) {
        toast.appendChild(actionButton);
        actionButton.style.marginLeft = "auto";
      }
      showToast();
    }

    function showToast(hideAfter = 5000) {
      toast.hidden = false;
      window.clearTimeout(hideTimer);
      window.requestAnimationFrame(() => toast.classList.add("is-visible"));
      hideTimer = window.setTimeout(() => {
        toast.classList.remove("is-visible");
        toast.hidden = true;
      }, hideAfter);
    }

    // Resolve the bridge at click time: pywebview injects window.pywebview only
    // after the page has finished loading, so reading it up front is wrong.
    async function save(link, confirm) {
      const api = window.pywebview && window.pywebview.api;
      if (!api || typeof api.save_m3u !== "function") {
        window.location.href = link.href;
        return;
      }
      let result;
      try {
        result = await api.save_m3u(
          link.dataset.jobId,
          link.dataset.playlistId,
          Boolean(confirm)
        );
      } catch (error) {
        showMessage("The playlist could not be saved: " + error.message);
        return;
      }
      if (!result || result.error) {
        showMessage(result ? result.error : "The playlist could not be saved.");
        return;
      }
      // The save was refused because the playlist references missing files;
      // warn and offer to save it anyway (the same click, confirmed).
      if (result.confirm_required) {
        showConfirmRequired(result, link);
        return;
      }

      const open = document.createElement("button");
      open.type = "button";
      open.className = "toast-action";
      open.textContent = "Open folder";
      open.addEventListener("click", async () => {
        try {
          await api.open_at(result.path);
        } catch (_error) {
          // the reveal silently failed; the toast already says where the file lives
        }
      });
      showSaved(result.name, open);
    }

    for (const link of links) {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        save(link, false);
      });
    }
  })();
</script>
