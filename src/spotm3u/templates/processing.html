<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Processing - Spotify to M3U</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Processing playlist</p>
      <h1>{{ playlist_name }}</h1>
      <p class="intro">Total tracks: {{ total_tracks }}</p>

      <form id="start-form" method="post" action="{{ url_for('start_processing', job_id=job_id, playlist_id=playlist_id) }}">
        <button type="submit">Start processing</button>
      </form>

      <p id="download-wrap" class="download" hidden>
        <a id="download-link" href="{{ url_for('download_m3u', job_id=job_id, playlist_id=playlist_id) }}">Save playlist (M3U)</a>
        ·
        <a href="{{ url_for('processing_result', job_id=job_id, playlist_id=playlist_id) }}">View full results</a>
      </p>

      <section id="progress" class="progress" hidden>
        <p id="job-status-text" class="status-line" role="status"></p>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <dl class="stats">
          <div><dt>Completed</dt><dd id="stat-completed">0</dd></div>
          <div><dt>Successful</dt><dd id="stat-successful">0</dd></div>
          <div><dt>Failed</dt><dd id="stat-failed">0</dd></div>
          <div><dt>Ambiguous</dt><dd id="stat-ambiguous">0</dd></div>
        </dl>
        <p id="current-track" class="current-track"></p>
        <p id="job-error" class="error" hidden></p>
        <ol id="track-list" class="track-list"></ol>
      </section>
    </main>
    <script>
      const startForm = document.getElementById("start-form");
      const progressSection = document.getElementById("progress");
      const progressBar = document.getElementById("progress-bar");
      const statusText = document.getElementById("job-status-text");
      const statCompleted = document.getElementById("stat-completed");
      const statSuccessful = document.getElementById("stat-successful");
      const statFailed = document.getElementById("stat-failed");
      const statAmbiguous = document.getElementById("stat-ambiguous");
      const currentTrackText = document.getElementById("current-track");
      const jobError = document.getElementById("job-error");
      const trackList = document.getElementById("track-list");
      const downloadWrap = document.getElementById("download-wrap");
      const statusUrl = "{{ url_for('processing_status', job_id=job_id, playlist_id=playlist_id) }}";

      const stageLabels = {
        queued: "Queued",
        "resolving-local": "Finding local audio",
        searching: "Searching online",
        "validating-source": "Checking source",
        downloading: "Downloading",
        "validating-audio": "Checking downloaded audio",
        complete: "Complete",
        failed: "Failed",
        ambiguous: "Ambiguous",
        skipped: "Skipped",
      };

      function stageLabel(status) {
        return stageLabels[status] || status;
      }

      function statusLabel(status) {
        switch (status) {
          case "queued":
            return "Waiting to start";
          case "running":
            return "Processing in progress";
          case "completed":
            return "Processing complete";
          case "failed":
            return "Processing failed";
          default:
            return status;
        }
      }

      function render(state) {
        progressSection.hidden = false;
        const total = state.playlist.total_tracks || 1;
        const percent = total > 0 ? Math.round((state.completed / total) * 100) : 0;
        progressBar.style.width = percent + "%";
        statusText.textContent = statusLabel(state.status);
        statCompleted.textContent = state.completed + " / " + state.playlist.total_tracks;
        statSuccessful.textContent = state.successful;
        statFailed.textContent = state.failed;
        statAmbiguous.textContent = state.ambiguous;
        currentTrackText.textContent = state.current_track
          ? "Current: " + state.current_track.title + " — " + stageLabel(state.current_track.status)
          : "";
        jobError.hidden = !state.error;
        jobError.textContent = state.error || "";
        renderTracks(state.tracks);
        downloadWrap.hidden = state.status !== "completed";
        if (state.status === "running") {
          setTimeout(poll, 1000);
        }
      }

      function renderTracks(tracks) {
        trackList.textContent = "";
        for (const track of tracks) {
          const item = document.createElement("li");
          item.classList.add("track-" + track.status);
          item.textContent = track.title + " (" + stageLabel(track.status) + ")";
          if (track.reason) {
            item.textContent += " — " + track.reason;
          }
          trackList.appendChild(item);
        }
      }

      async function poll() {
        try {
          const response = await fetch(statusUrl);
          if (response.ok) {
            render(await response.json());
          }
        } catch (_error) {
          setTimeout(poll, 1000);
        }
      }

      async function loadExisting() {
        try {
          const response = await fetch(statusUrl);
          if (response.ok) {
            startForm.hidden = true;
            render(await response.json());
          }
        } catch (_error) {
          // No job yet; keep the start button visible.
        }
      }

      startForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = startForm.querySelector("button");
        button.disabled = true;
        try {
          const response = await fetch(startForm.action, { method: "POST" });
          if (response.status === 202 || response.status === 409) {
            startForm.hidden = true;
            render(await response.json());
          } else {
            statusText.textContent = "Unable to start processing. Please try again.";
            progressSection.hidden = false;
          }
        } finally {
          button.disabled = false;
        }
      });

      loadExisting();
    </script>
  </body>
</html>
