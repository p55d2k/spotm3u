<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Processing - Spotify to M3U</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Playlist selected</p>
      <h1>Ready to process</h1>
      <p role="status">Your playlist selection was saved. Track matching will continue here.</p>
      <form id="start-form" method="post" action="{{ url_for('start_processing', job_id=job_id, playlist_id=playlist_id) }}">
        <button type="submit">Start processing</button>
      </form>
      <dl id="job-status"></dl>
    </main>
    <script>
      const startForm = document.getElementById("start-form");
      const statusContainer = document.getElementById("job-status");
      const statusUrl = "{{ url_for('processing_status', job_id=job_id, playlist_id=playlist_id) }}";

      function render(state) {
        const lines = [
          "Status: " + state.status,
          "Completed: " + state.completed + " / " + state.playlist.total_tracks,
          "Successful: " + state.successful,
          "Failed: " + state.failed,
          "Ambiguous: " + state.ambiguous,
          state.current_track ? "Current: " + state.current_track.title + " (" + state.current_track.status + ")" : "",
          state.error ? "Error: " + state.error : "",
        ].filter(Boolean);
        statusContainer.innerHTML = lines.join("<br>");
        if (state.status === "running") {
          setTimeout(poll, 1000);
        }
      }

      async function poll() {
        try {
          const response = await fetch(statusUrl);
          render(await response.json());
        } catch (_error) {
          setTimeout(poll, 1000);
        }
      }

      startForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = startForm.querySelector("button");
        button.disabled = true;
        try {
          const response = await fetch(startForm.action, { method: "POST" });
          render(await response.json());
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
