<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Batch processing - Exportify to M3U</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Batch processing</p>
      <h1>Download selected playlists</h1>
      <form id="start-form" method="post" action="{{ url_for('start_batch_processing', job_id=job_id) }}">
        <button type="submit">Start batch processing</button>
      </form>
      <section id="progress" class="progress" hidden>
        <p id="status" class="status-line" role="status"></p>
        <div class="progress-track"><div id="bar" class="progress-bar"></div></div>
        <p id="summary"></p>
        <ul id="playlists"></ul>
      </section>
    </main>
    <script>
      const form = document.getElementById("start-form");
      const progress = document.getElementById("progress");
      const status = document.getElementById("status");
      const bar = document.getElementById("bar");
      const summary = document.getElementById("summary");
      const list = document.getElementById("playlists");
      const statusUrl = "{{ url_for('batch_processing_status', job_id=job_id) }}";
      function render(state) {
        progress.hidden = false;
        status.textContent = state.status === "completed" ? "Batch complete" : "Processing playlists";
        bar.style.width = (state.total ? Math.round(state.completed / state.total * 100) : 0) + "%";
        summary.textContent = state.completed + " / " + state.total + " tracks complete · " + state.successful + " successful · " + state.failed + " failed";
        list.textContent = "";
        for (const playlist of state.playlists) {
          const item = document.createElement("li");
          item.textContent = playlist.playlist.name + ": " + playlist.status + " (" + playlist.completed + " / " + playlist.playlist.total_tracks + " tracks)";
          list.appendChild(item);
        }
        if (state.status === "completed" || state.status === "failed") {
          const link = document.createElement("a");
          link.href = "{{ url_for('batch_processing_result', job_id=job_id) }}";
          link.textContent = "View batch results";
          list.appendChild(link);
        } else {
          setTimeout(poll, 700);
        }
      }
      async function poll() {
        const response = await fetch(statusUrl);
        if (response.ok) render(await response.json());
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        form.hidden = true;
        const response = await fetch(form.action, {method: "POST"});
        if (response.ok) render((await response.json()).status);
      });
    </script>
  </body>
</html>
