name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-14
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux GTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1

      - name: Install dependencies
        run: uv sync --locked --group build

      - name: Install FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Download and extract inside a dedicated directory so only the
          # archive's own FFmpeg binaries can ever be added to PATH.
          $ErrorActionPreference = 'Stop'
          # Inspect curl failures through $LASTEXITCODE so an unreachable source
          # falls through to the next one instead of aborting the step.
          $PSNativeCommandUseErrorActionPreference = $false
          $stage = Join-Path $env:RUNNER_TEMP 'ffmpeg-download'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $archive = Join-Path $stage 'ffmpeg.zip'

          # Prefer the usual host, then fall back to a GitHub-hosted build so a
          # 503 or rate limit upstream does not block a release. Retries are
          # deliberately bounded (curl honors a long Retry-After header) so a
          # misbehaving host fails fast instead of stalling the job.
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )
          $downloaded = $false
          foreach ($url in $sources) {
            Remove-Item -Force -ErrorAction SilentlyContinue $archive
            Write-Host "Downloading FFmpeg from $url"
            curl.exe -fsSL --retry 3 --retry-delay 5 --retry-max-time 120 --max-time 300 -o "$archive" "$url"
            if ($LASTEXITCODE -eq 0 -and (Test-Path $archive) -and (Get-Item $archive).Length -gt 0) {
              $downloaded = $true
              break
            }
            Write-Warning "FFmpeg download failed with exit code $LASTEXITCODE"
          }
          if (-not $downloaded) { throw 'could not download FFmpeg from any known source' }

          $extract = Join-Path $stage 'extracted'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $bin = Get-ChildItem $extract -Recurse -Directory -Filter 'bin' | Select-Object -First 1
          if (-not $bin) { throw "FFmpeg bin directory not found in $(Split-Path -Leaf $archive)" }
          foreach ($exe in @('ffmpeg.exe', 'ffprobe.exe')) {
            if (-not (Test-Path (Join-Path $bin.FullName $exe))) {
              throw "missing $exe in $($bin.FullName)"
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin.FullName
          Write-Host "Using FFmpeg from $($bin.FullName)"

      - name: Install FFmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install ffmpeg
          mkdir -p ffmpeg-stage
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" ffmpeg-stage/ffmpeg
          cp "$(brew --prefix ffmpeg)/bin/ffprobe" ffmpeg-stage/ffprobe
          chmod +x ffmpeg-stage/ffmpeg ffmpeg-stage/ffprobe

      - name: Stage FFmpeg for bundling (Windows, Linux)
        if: matrix.platform != 'macos'
        run: uv run -q python packaging/stage_ffmpeg.py ffmpeg-stage

      - name: Compute release version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        env:
          SPOTM3U_FFMPEG_DIR: ${{ github.workspace }}/ffmpeg-stage
          SPOTM3U_APP_VERSION: ${{ env.VERSION }}
        run: uv run -q build

      - name: Verify Windows app config is packaged
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # The .config lets pythonnet load its assembly even when a
          # browser-downloaded ZIP marked the bundle with the Mark of the Web.
          $config = 'dist/SpotM3U/SpotM3U.exe.config'
          if (-not (Test-Path $config)) { throw "missing $config next to the executable" }
          if (-not (Select-String -Path $config -Pattern 'loadFromRemoteSources')) {
            throw "$config does not enable loadFromRemoteSources"
          }

      - name: Package release archive
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            bundle="dist/SpotM3U.app"
          else
            bundle="dist/SpotM3U"
          fi
          uv run -q python packaging/make_archive.py "$bundle" "dist-artifacts/SpotM3U-v${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      - name: Build macOS PKG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # The installer writes the payload files fresh, so
          # /Applications/SpotM3U.app is never quarantined and the unsigned app
          # launches normally on modern macOS.
          uv run -q python packaging/make_pkg.py \
            --version "${{ env.VERSION }}" \
            "dist/SpotM3U.app" \
            "dist-artifacts/SpotM3U-v${{ env.VERSION }}-macos-${{ matrix.arch }}.pkg"

      - name: Verify PKG contains the application
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          pkg=$(find dist-artifacts -maxdepth 1 -name 'SpotM3U-v*.pkg' -print -quit)
          test -n "$pkg"
          rm -rf /tmp/pkg-verify
          pkgutil --expand-full "$pkg" /tmp/pkg-verify
          uv run -q python packaging/verify_macos_bundle.py /tmp/pkg-verify

      - name: Upload build archive
        uses: actions/upload-artifact@v4
        with:
          name: SpotM3U-v${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-artifacts/*
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.platform }}-${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-14
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux GTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1

      - name: Install dependencies
        run: uv sync --locked

      - name: Compute release version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: SpotM3U-v${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-artifacts

      - name: Assert archive naming
        shell: bash
        run: |
          expected="SpotM3U-v${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          find dist-artifacts -type f -name "$expected" -print -quit | grep -q . || {
            echo "expected release archive missing: $expected"
            find dist-artifacts -maxdepth 3 -print
            exit 1
          }

      - name: Extract release archive (Linux, macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          archive=$(find dist-artifacts -type f -name "SpotM3U-v${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip" -print -quit)
          test -n "$archive"
          extract_dir="${archive%.zip}-extracted"
          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"

      - name: Validate macOS application bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          archive=$(find dist-artifacts -type f -name "SpotM3U-v${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip" -print -quit)
          test -n "$archive"
          uv run -q python packaging/verify_macos_bundle.py "$archive"

      - name: Extract and smoke test packaged application
        if: matrix.platform == 'windows'
        run: uv run -q python packaging/smoke_test.py dist-artifacts

      - name: Smoke test extracted application (Linux, macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          artifact=$(find dist-artifacts -type d -name '*-extracted' -print -quit)
          test -n "$artifact"
          uv run -q python packaging/smoke_test.py "$artifact"

  release:
    name: Publish GitHub Release
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: "SpotM3U-*"
          path: release-artifacts
          merge-multiple: true

      - name: Compute release version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish macOS assets instead of the macOS ZIP
        shell: bash
        run: |
          # The ZIP is kept only for CI verification. A browser-downloaded ZIP
          # makes the unsigned app hang on modern macOS. The PKG -- whose
          # installed files are written fresh and therefore never quarantined --
          # is the reliable macOS install path.
          rm -f release-artifacts/*-macos-*.zip
          test -n "$(find release-artifacts -maxdepth 1 -type f -name '*-macos-*.pkg' -print -quit)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
