name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-14
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --group build

      - name: Install FFmpeg (Windows)
        run: |
          winget install --id Gyan.FFmpeg -e --silent
          # Add ffmpeg to GITHUB_PATH for subsequent steps
          $ffmpegPath = "$env:ProgramFiles\FFmpeg\bin"
          if (!(Test-Path $ffmpegPath)) {
              # Fallback location if installed via alternative scope
              $ffmpegPath = "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe\ffmpeg-*\bin"
          }
          echo $ffmpegPath >> $env:GITHUB_PATH

      - name: Install FFmpeg (Linux, static)
        if: matrix.platform == 'linux'
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          BIN=$(find /tmp -maxdepth 3 -type d -name bin -path '*gpl*' | head -1)
          test -n "$BIN" || { echo "ffmpeg bin dir not found"; exit 1; }
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Install FFmpeg (macOS arm64, static)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p ffmpeg-stage
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg-stage/ffmpeg "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64"
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg-stage/ffprobe "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-arm64"
          chmod +x ffmpeg-stage/ffmpeg ffmpeg-stage/ffprobe

      - name: Stage FFmpeg for bundling (Windows, Linux)
        if: matrix.platform != 'macos'
        run: uv run -q python packaging/stage_ffmpeg.py ffmpeg-stage

      - name: Compute release version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        env:
          SPOTM3U_FFMPEG_DIR: ${{ github.workspace }}/ffmpeg-stage
        run: uv run -q --group build pyinstaller --noconfirm --clean packaging/spotm3u.spec

      - name: Package release archive
        run: uv run -q python packaging/make_archive.py dist/spotm3u dist-artifacts/spotm3u-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip

      - name: Upload build archive
        uses: actions/upload-artifact@v4
        with:
          name: spotm3u-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-artifacts/*.zip
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.platform }}-${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-14
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Compute release version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: spotm3u-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-artifacts

      - name: Assert archive naming
        shell: bash
        run: |
          expected="spotm3u-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          find dist-artifacts -type f -name "$expected" -print -quit | grep -q . || {
            echo "expected release archive missing: $expected"
            find dist-artifacts -maxdepth 3 -print
            exit 1
          }

      - name: Extract release archive (Linux, macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          archive=$(find dist-artifacts -type f -name "spotm3u-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip" -print -quit)
          test -n "$archive"
          extract_dir="${archive%.zip}-extracted"
          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"

      - name: Extract and smoke test packaged application
        if: matrix.platform == 'windows'
        run: uv run -q python packaging/smoke_test.py dist-artifacts

      - name: Smoke test extracted application (Linux, macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          bundle=$(find dist-artifacts -type d -name spotm3u -print -quit)
          test -n "$bundle"
          uv run -q python packaging/smoke_test.py "$bundle"

  release:
    name: Publish GitHub Release
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: "spotm3u-*"
          path: release-artifacts
          merge-multiple: true

      - name: Compute release version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: spotm3u ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*.zip
