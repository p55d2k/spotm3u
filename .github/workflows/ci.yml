name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux GTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Ruff lint
        run: uv run ruff check src tests packaging

      - name: Run Ruff format check
        run: uv run ruff format --check src tests packaging

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux GTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ``npm ci`` installs exactly the committed lockfile, so a broken or
      # drifted lockfile fails here instead of during a release build.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Type-checks first (see frontend/package.json), then bundles.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
