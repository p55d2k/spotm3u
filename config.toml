# SpotM3U optional configuration.
#
# This file is entirely optional. Every value below already matches the
# built-in default, so you can delete the file and the app keeps working.
#
# The app loads it automatically when it exists in the current working
# directory. To use a different location, set SPOTM3U_CONFIG to the file path:
#
#   SPOTM3U_CONFIG=~/SpotM3U.toml uv run dev
#
# Uncomment a line (and change its value) to customize that setting.
# Fallback examples are shown next to each setting.

[web]
# Preferred HTTP port used by SpotM3U. The server binds to 127.0.0.1 and
# falls back to a free port when this one is already taken, so a busy port
# does not prevent startup. In development the UI opens in the default browser;
# the packaged desktop app shows its native window instead. Set
# SPOTM3U_NO_WEBVIEW=1 to skip the native window for scripted runs.
# port = 5001

# Where uploaded Exportify ZIP jobs are stored temporarily.
# Defaults to the system temp directory + "spotm3u".
# Windows example: "C:/Users/you/AppData/Local/spotm3u"
# upload_root = "/tmp/spotm3u"

# Root folder searched for local audio files when matching tracks.
# Defaults to ~/Music.
# Windows example: "~/Music" or "C:/Users/you/Music"
# music_library = "~/Music"

# Where downloaded MP3s and the generated playlist.m3u are written.
# Defaults to <music_library>/SpotM3U. Earlier releases used
# <music_library>/SpotM3U-downloads, which is renamed to the new name the first
# time a download directory is resolved; a path set here is used as given.
# Windows example: "~/Music/SpotM3U"
# download_dir = "~/Music/SpotM3U"

# How many tracks are resolved in parallel (search phase only).
# resolve_workers = 3

# Logging verbosity for developer diagnostics. Per-track records always
# include the job and track identifiers. Use DEBUG for full stage tracing.
# Also read from the SPOTM3U_LOG_LEVEL environment variable when unset.
# log_level = "INFO"

[upload]
# Maximum accepted ZIP size in bytes (default 50 MiB = 52428800).
# max_upload_size = 52428800

# Maximum total expanded size (bytes) of all extracted files before the upload
# is rejected as unsafe (default 512 MiB = 536870912). Clamps zip bombs.
# max_decompressed_size = 536870912

# Maximum number of entries allowed inside one uploaded ZIP (default 10000).
# max_archive_entries = 10000

# How long (seconds) an upload job directory is kept before cleanup. Stale
# uploads are swept on each new upload and at server startup; jobs still
# processing are never removed. Download audio and generated M3Us live outside
# the job directory and are kept. (default 86400 = 24 hours).
# max_job_age = 86400

[search]
# How many results each online search query returns.
# max_results = 8

# How many search queries run at once for one track.
# max_search_workers = 4

# Per-socket-operation timeout (seconds) applied to each search query so a
# hung source cannot occupy a worker forever.
# socket_timeout = 30

[fast]
# Fast mode: prioritise download speed over match confidence and metadata.
# It finds audio, downloads it and writes the playlist, skipping source
# validation, downloaded-audio validation, retries against other candidates,
# artwork/lyrics lookups and all metadata embedding. Downloads of large
# playlists finish much faster, but matches can be less accurate and the MP3s
# contain no tags, artwork or lyrics. It can also be toggled per run on the
# processing page.
# enabled = false

[metadata]
# Master switch for writing anything into the downloaded audio file. Set to
# false for "just the audio": no text tags, album cover, artist image or
# lyrics are embedded (nothing is downloaded for them either), so the MP3s stay
# as small as possible. This overrides every per-feature option below.
# enabled = true

# When true (default), the standard ID3 text fields are written from the
# playlist metadata: title, artists, album, album artist, track/disc number,
# year, genre and comment. Set to false to leave the downloader's own tags
# untouched. File names and the M3U are unaffected either way.
# tags = true

[artwork]
# When true (default), album artwork for a track is verified against the
# release identity (MusicBrainz / Cover Art Archive / iTunes) before any local
# cover is used, so a wrong cover already embedded in a local file is never
# borrowed. When false, existing local artwork is trusted and used immediately,
# avoiding these network lookups entirely for files that already carry a cover
# at the cost of possibly keeping a wrong one.
# verify_local = true

# When true (default), the album front cover is embedded in the MP3 as the
# album artwork. Embedded covers are much larger than tags or lyrics, so set
# this to false to save space. No cover lookup or download happens either.
# album_artwork = true

# When true (default), the performing artist's profile image is embedded into
# each MP3 as an ID3 artist picture (APIC type 8) in addition to the album
# artwork, reusing one cached image per artist. Missing artist artwork never
# affects the track. When false, no artist image lookup or embedding happens.
# artist_artwork = true

# Seconds to wait for each artwork lookup request (MusicBrainz, Cover Art
# Archive, iTunes, Deezer) before it is abandoned and the next source is tried.
# (default 15)
# request_timeout = 15

# Limits for the artist-artwork identity check. Deezer search hits are kept as
# exact-name candidates up to artist_search_limit (default 25); the matching
# MusicBrainz hit is chosen from up to musicbrainz_artist_limit results (default
# 10); and the artist_verification_limit (default 3) strongest candidates have
# their releases checked for corroboration before an image is trusted. Lowering
# these cuts the number of lookups per track, at the cost of weaker matching.
# artist_search_limit = 25
# musicbrainz_artist_limit = 10
# artist_verification_limit = 3

# How many resolved artwork images the in-process memory cache keeps (default
# 1024) before the oldest entries are dropped. The limit balances memory use
# against reusing repeated lookups within the same run.
# memory_cache_size = 1024

[lyrics]
# When true (default), each resolved track is looked up in public lyrics
# providers through the syncedlyrics library and any lyrics found are embedded
# in the audio file's lyrics metadata field (ID3 USLT). Synced (timed) lyrics
# are preferred and fall back to plain text; when they are timed, the
# timestamps are kept in the field and an .lrc sidecar is written next to the
# audio file (song.mp3 -> song.lrc) for players that read a sidecar.
# Lyrics are optional enrichment: a track without lyrics, an unavailable
# provider, or a write failure never fails the download, and existing metadata
# and artwork are kept. Set to false to skip lyrics lookups entirely (fast mode
# does this too, since it skips metadata enrichment, and so does
# [metadata] enabled = false).
# enabled = true

[download]
# MP3 bitrate used by yt-dlp when extracting downloaded audio.
# audio_quality = "192"

# How many tracks are downloaded at once. A separate, smaller cap than
# resolve_workers so the per-track yt-dlp/ffmpeg work never spawns an
# uncontrolled number of processes. (default 2)
# If YouTube starts asking "sign in to confirm you're not a bot" or rate
# limits you, lower this number or set cookies_from_browser to a signed-in
# session instead of raising it further.
# workers = 2

# Maximum wall-clock time (seconds) for a single download before it is
# abandoned. Set to 0 to disable.
# timeout = 600

# Download retry counts (total and per fragment) and the network timeout
# (seconds) used for each download.
# retries = 5
# fragment_retries = 5
# socket_timeout = 30

# Optional browser used by yt-dlp to import your local YouTube cookies.
# Supported values include chrome, chromium, firefox, safari, edge, brave,
# opera, vivaldi, and whale. This is the explicit authentication mechanism:
# when YouTube asks for a signed-in session, set this rather than expecting a
# PO token to authenticate. Keep the browser signed in to YouTube; cookies are
# read locally and never written to logs or returned by the web app.
# cookies_from_browser = "chrome"

# Optional bgutil provider overrides. The bgutil yt-dlp plugin and the
# provider are separate; installing the plugin does not start a provider.
# Choose and prepare exactly one provider first. Docker is optional.
#
# HTTP server option (Docker or native). Native on Node 22+ or Deno 2.0.0+:
#   git clone --single-branch --branch 2.0.0 \
#     https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
#   cd bgutil-ytdlp-pot-provider/server && npm ci && npx tsc
#   node build/main.js
# Loopback binding is recommended: the provider is unauthenticated.
# docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416
#   brainicism/bgutil-ytdlp-pot-provider:2.0.0
# pot_provider_url = "http://127.0.0.1:4416"
#
# Script option requires a matching checkout; Node 22+ or Deno 2.0.0+.
# pot_provider_home = "~/bgutil-ytdlp-pot-provider/server"
#
# Seconds to wait for a configured HTTP provider to answer its /ping probe
# before the pre-download check reports it as not running or reachable. Raise
# this when a provider needs longer to start up. (default 5)
# pot_provider_timeout = 5

[m3u]
# Write an extended M3U (the #EXTM3U header plus #EXTINF metadata lines).
# extended = true

# Write paths relative to the download directory instead of absolute paths,
# keeping the playlist portable as long as it stays next to the audio.
# relative = false

[update]
# Check GitHub for a newer SpotM3U release and show an in-app update notice.
# The check never blocks or fails the app and never replaces the app itself;
# it only prompts the user to download the new installer.
# check = true

# How often (hours) the running app asks GitHub for the latest release.
# check_interval_hours = 24

# Repository whose releases are checked, in OWNER/REPO form.
# github_repo = "p55d2k/spotm3u"

# Seconds to wait for the GitHub release check before giving up. The check is
# best-effort and never blocks or fails the app, so a slow or unreachable
# GitHub only delays the update notice. (default 10)
# request_timeout = 10