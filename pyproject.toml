[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotm3u"
version = "0.1.0"
description = "Spotify to M3U Converter: create validated local M3U playlists from Spotify playlist exports."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # bgutil 2.x supplies the yt-dlp PO Token providers spotm3u validates
    # (youtubepot-bgutilhttp / youtubepot-bgutilscript).
    "bgutil-ytdlp-pot-provider>=2.0",
    "flask>=3.1",
    "mutagen>=1.47",
    # Native desktop shell: pywebview provides the window around Flask in the
    # production ``uv run app`` workflow. Its own platform markers pull the
    # Cocoa (PyObjC) stack on macOS and pythonnet on Windows; on Linux the GTK
    # extra supplies the PyGObject backend.
    "pywebview>=5; sys_platform != 'linux'",
    "pywebview[gtk]>=5; sys_platform == 'linux'",
    "requests>=2.32",
    # "Add lyrics" enrichment: fetches plain or time-synced lyrics for a track
    # from public lyrics providers through one library API instead of spotm3u
    # scraping or searching for lyrics itself.
    "syncedlyrics>=1.0",
    # YouTube error messages and PO-token handling are version-sensitive;
    # spotm3u's YouTube classification and diagnostics are verified against
    # this release line rather than an older PO-token-era minimum.
    "yt-dlp>=2026.8.19",
    "zhconv>=1.4",
]

[project.scripts]
spotm3u = "spotm3u.launcher:main"
app = "spotm3u.launcher:main"
dev = "spotm3u.dev:main"
build = "spotm3u.build:main"

[dependency-groups]
dev = [
    "pre-commit>=4.2",
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
]
build = [
    "pyinstaller>=6.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spotm3u"]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
markers = [
    "slow: integration tests with real external tools, excluded from pre-commit",
]

[tool.ruff]
target-version = "py313"
line-length = 100

# Ruff is configured as both the linter and formatter for this project.
#
# Lint rules (selected below):
#   E  – pycodestyle errors
#   F  – pyflakes (unused imports, undefined names, etc.)
#   I  – isort (import ordering)
#   UP – pyupgrade (modernize syntax for the target Python version)
#   B  – flake8-bugbear (common bug patterns)
#
# Formatting is handled by `ruff format` and configured in `.pre-commit-config.yaml`
# alongside the lint hook.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
