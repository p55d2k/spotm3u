[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotm3u"
version = "0.1.0"
description = "Create local M3U playlists from Spotify playlist metadata."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "playwright>=1.52",
    "rich>=14.0",
    "typer>=0.16",
]

[project.scripts]
spotm3u = "spotm3u.cli:app"
spotm3u-web = "spotm3u.app:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spotm3u"]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
