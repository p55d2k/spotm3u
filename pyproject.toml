[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotm3u"
version = "0.1.0"
description = "Spotify to M3U Converter: create validated local M3U playlists from Spotify playlist exports."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "mutagen>=1.47",
    "requests>=2.32",
    "yt-dlp>=2025.1.15",
    "zhconv>=1.4",
]

[project.scripts]
spotm3u = "spotm3u.app:run"

[dependency-groups]
dev = [
    "pre-commit>=4.2",
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spotm3u"]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
